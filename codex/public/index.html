<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>buildboard · Codex 版</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body>
<header><div><h1>buildboard <span>Codex 版</span></h1></div><div id="quota" aria-live="polite"><span>5 小时剩余</span><strong id="remaining">—</strong><progress id="meter" max="100" value="0" aria-label="5 小时剩余额度"></progress><small id="quota-detail">正在读取…</small></div></header>
<main><section class="composer"><h2 id="editor-title">随手记</h2><form id="note-form"><label for="title">标题</label><input id="title" maxlength="80" placeholder="可选"><label for="text">内容</label><textarea id="text" maxlength="4000" placeholder="写点什么，也可以粘贴或拖入图片…"></textarea><div id="attachments"></div><div class="editor-actions"><label class="file-button" for="files">＋ 图片<input id="files" type="file" accept="image/*" multiple></label><span id="count">0 / 4000</span></div><div class="editor-actions"><button type="submit" class="primary" id="save">记下</button><button type="button" id="cancel" hidden>取消编辑</button></div><small>Enter 保存 · Shift / Ctrl / ⌘ + Enter 换行</small></form><p id="message" role="status"></p></section>
<section class="history"><div class="section-head"><h2>记录 <span id="note-count">0</span></h2><button id="export">导出备份</button></div><div id="notes"><p class="empty">正在读取…</p></div></section></main>
<dialog id="analysis-dialog"><div class="section-head"><h2>Codex 分析</h2><button id="close-analysis" aria-label="关闭分析">关闭</button></div><label for="workspace">工作区目录（可选）</label><input id="workspace" placeholder="填写绝对路径，可结合项目文件分析"><p class="muted">使用当前 Codex CLI 登录，只做分析。会消耗账户额度；当前聊天记录不会自动传入。</p><button id="run-analysis" class="primary">开始分析</button><pre id="analysis-result" aria-live="polite"></pre></dialog>
</body></html>
